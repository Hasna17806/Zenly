services:

  mongodb:
    image: mongo:latest
    container_name: zenly-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: zenly-backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/zenly
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: zenly-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data: